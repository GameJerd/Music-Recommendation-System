scale:
  tier: S

paths:
  raw: data/raw
  synthetic: data/synthetic
  content: artifacts/content
  db: data/recsys.db          # holds tracks and (from Phase 3) logged events, so not under artifacts/

features:
  # starting values; tuned on validation in Phase 4. Zero drops a block (used for ablations).
  block_weights:
    audio: 0.5
    genre: 0.35
    decade: 0.15

blend:
  w_max: 0.75
  k: 7.5          # must equal 5 * (w_max / 0.3 - 1) to keep the 70/30 anchor at 5 plays
  candidates: 200

seed: 42
