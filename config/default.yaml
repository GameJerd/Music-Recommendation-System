scale:
  tier: S

paths:
  raw: data/raw
  content: artifacts/content
  db: data/recsys.db          # tracks and logged events, so not under artifacts/
  reports: reports

features:
  # Zero drops a block (used for ablations). Not tuned: there is no user signal to tune on (decisions.md).
  block_weights:
    audio: 0.5
    genre: 0.35
    decade: 0.15

recommend:
  candidates: 200             # nearest neighbours fetched before re-ranking, dedupe and the artist cap
  artist_cap: 2               # max tracks per primary artist in one list; 0 = no cap
  popularity_boost: 0.0       # score = cosine + boost * popularity/100; 0 = pure similarity

eval:
  k: 10
  n_seeds: 2000               # random seed tracks per variant in scripts/evaluate.py

seed: 42
