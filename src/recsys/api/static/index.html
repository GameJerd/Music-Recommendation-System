<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slopify</title>
  <meta name="description" content="Find music by how it sounds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="4" y="9" width="3.2" height="6" rx="1.6"/><rect x="10.4" y="4.5" width="3.2" height="15" rx="1.6"/><rect x="16.8" y="7.5" width="3.2" height="9" rx="1.6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.4 12 4l8 6.4V19a1 1 0 0 1-1 1h-4.6v-5.6H9.6V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.4-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z" fill="currentColor"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true"></div>

  <div class="app">
    <aside class="side">
      <a class="brand" href="#/" aria-label="Slopify home">
        <svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg>Slopify
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home"><svg aria-hidden="true"><use href="#i-home"/></svg>Home</a>
        <a href="#/search" data-nav="search"><svg aria-hidden="true"><use href="#i-search"/></svg>Search</a>
      </nav>
      <section class="recent" aria-labelledby="recent-h">
        <h2 id="recent-h">Recently played</h2>
        <ol id="recent"></ol>
      </section>
      <div class="side-foot">
        <label class="who">
          <span>Listening as</span>
          <input id="user" autocomplete="off" spellcheck="false" maxlength="40">
        </label>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
